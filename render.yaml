services:
  - type: web
    name: unique-brew-cafe-backend
    runtime: node
    region: singapore
    plan: free

    # Use repo root for monorepo installs
    rootDir: .

    # Install once at root, then build only backend
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter backend build
    startCommand: pnpm --filter backend start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # ✅ Use the env key your backend actually reads
      - key: MONGODB_URI
        sync: false

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # CORS (set these to REAL domains)
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGIN
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Brevo (match your backend keys)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: BREVO_PARTNER_KEY
        sync: false

      # Rate limiting + pool sizes
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: MONGO_MAX_POOL_SIZE
        value: 10
      - key: MONGO_MIN_POOL_SIZE
        value: 2

    autoDeploy: true
